function validState(x){
 const arr=['jobs','audit','enrolled','completed','saved','interventions','curriculum','improvements','grievances','feedback','access'];
 if(!x||x.version!==VERSION||arr.some(k=>!Array.isArray(x[k]))||!x.profile||!x.applications||!x.checkpoints?.aditi||!x.checkpoints?.arjun)return false;
 if(['education','employer','analytics'].some(k=>typeof x.consent?.[k]!=='boolean')||typeof x.education!=='boolean'||typeof x.assessment!=='boolean'||!['Not assigned','Assigned','Completed'].includes(x.internship))return false;

 if(!strings(x.profile,['interest','district','sector','portfolio','status']))return false;
 if(!x.jobs.every(j=>strings(j,['id','title','company','location','type','deadline','arrangement'])&&nums(j,['salaryMin','salaryMax','openings'])&&Array.isArray(j.skills)&&j.skills.every(s=>typeof s==='string')))return false;
 if(![...x.enrolled,...x.completed].every(id=>COURSES.some(c=>c.id===id)))return false;
 if(!Object.entries(x.applications).every(([id,a])=>x.jobs.some(j=>j.id===id)&&['Applied','Shortlisted','Interview','Offered','Accepted','Onboarded','Rejected'].includes(a.status)))return false;
 if(!Object.values(x.checkpoints).every(group=>Object.entries(group).every(([m,c])=>[2,6,12,24].includes(+m)&&nums(c,['salary','hours','utilisation','satisfaction','unemployment'])&&strings(c,['job','sustained','same','contract','social','mobility']))))return false;
 if(x.employment&&(!nums(x.employment,['salary'])||!strings(x.employment,['job','join','jobId'])))return false;
 if(!x.interventions.every(i=>nums(i,['baseline','target','budget'])&&strings(i,['name','department','district','status'])))return false;
 return true;
}

function lineChart(title,labels,values,unit='%',second=null){const max=unit==='%'?100:Math.ceil(Math.max(1,...values,...(second||[]))/10000)*10000;const series=[values,...(second?[second]:[])];const svg=`<svg viewBox="0 0 600 225" role="img" aria-label="${esc(title)}"><title>${esc(title)}; data table follows</title>${[0,.5,1].map(r=>`<line x1="55" y1="${185-r*150}" x2="575" y2="${185-r*150}" stroke="#dce5ed"/><text x="2" y="${189-r*150}">${Math.round(max*r)}</text>`).join('')}${series.map((v,j)=>`<polyline fill="none" stroke="${j?'#b2813d':'#27658b'}" stroke-width="3" points="${v.map((n,i)=>`${55+i*520/Math.max(1,v.length-1)},${185-n/max*150}`).join(' ')}"/>${v.map((n,i)=>`<circle cx="${55+i*520/Math.max(1,v.length-1)}" cy="${185-n/max*150}" r="4" fill="${j?'#b2813d':'#27658b'}"><title>${esc(labels[i])}: ${n} ${esc(unit)}</title></circle>`).join('')}`).join('')}${labels.map((l,i)=>labels.length>8&&i%4!==0&&i!==labels.length-1?'':`<text x="${55+i*520/Math.max(1,labels.length-1)}" y="210" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>`;return `<div class="chart"><div class="legend">${esc(title)} · ${esc(unit)} ${second?'· Blue: selected / Amber: benchmark':''}</div>${svg}<details><summary>Accessible chart data</summary>${table(['Period','Value ('+esc(unit)+')',...(second?['Benchmark']:[])],labels.map((l,i)=>[esc(l),values[i],...(second?[second[i]]:[])]),title+' · synthetic')}</details></div>`}

function aggregateFilters(){const keys=[['district','District'],['period','Period'],['scheme','Scheme'],['sector','Sector'],['occupation','Occupation'],['gender','Gender'],['qualification','Qualification'],['institution','Institution'],['employer','Employer']];return `<div class="card"><div class="section-title"><h2>Explore a cohort</h2>${button('Clear filters','clear-filters','','text-button')}</div><div class="filters">${keys.map(([k,l])=>selectField(l,k,['All',...distinct(k)],filters[k]||'All',`data-filter="${k}"`)).join('')}</div><details style="margin-top:12px"><summary>Additional geography and inclusion filters</summary><div class="filters">${[['state','State'],['division','Division'],['taluka','Taluka'],['area','Urban / rural'],['age','Age group'],['social','Social category'],['disability','Disability'],['type','Employment type'],['course','Course']].map(([k,l])=>selectField(l,k,['All',...distinct(k)],filters[k]||'All',`data-filter="${k}"`)).join('')}</div></details></div>`}
function government(){const rows=filteredCohorts(),m=metricRows(rows),add=!!S.employment&&S.consent.analytics;return `${aggregateFilters()}<div id="aggregate-content" class="stack">${governmentBody(rows,m,add)}</div>`}
function governmentBody(rows,m,add){if(!rows.length)return '<div class="empty">No synthetic cohort matches this combination. Clear filters to restore the observatory.</div>';return `<div class="grid">${kpi('Registered learners',m.n.toLocaleString('en-IN'),rows.length+' aggregate cells')}${kpi('Placed candidates',m.placed.toLocaleString('en-IN'),pct(m.placed,m.completion)+' of certified learners')}${kpi('6-month retention',pct(m.r6,m.placed),'Same entry cohort denominator')}${kpi('Mean salary proxy',money(m.salary),'Weighted district-cell mean; not median')}</div><div class="two">${card('Sustained outcomes, beyond placement',lineChart('Retention of placed cohort',['2 mo','6 mo','12 mo','24 mo'],[m.r2,m.r6,m.r12,m.r24].map(n=>+(n/m.placed*100).toFixed(1))), 'Historical synthetic cohorts; no causal or national inference.')}${card('Signals requiring attention',`<div class="alert-row">${badge('Retention alert','amber')}<p>Gadchiroli and Nanded show the weakest six-month retention in the unfiltered example.</p></div><div class="alert-row">${badge('Skills shortage','blue')}<p>Green energy has a ${m.gap}/100 selected-cohort gap proxy. Review employer evidence before increasing seats.</p></div><div class="alert-row">${badge('Inclusion review','amber')}<p>Compare gender and rural/urban cohorts with equivalent qualifications and sectors.</p></div>${button('Ask KRITI for evidence →','navigate','analyst','text-button')}`)}</div><div class="grid">${kpi('Completion rate',pct(m.completion,m.n),'Certified / registered')}${kpi('Employment rate',pct(m.placed,m.n),'Placed / registered, not official rate')}${kpi('Formal employment share',pct(m.formal,m.placed),'Formal placements / placements')}${kpi('Cost / 6-mo sustained job',money(m.cost/m.r6),'Sample training cost / retained')}</div><div class="notice info"><b>Connected-journey contribution:</b> ${add?'1 consented synthetic employment confirmation':'0 consented synthetic employment confirmations'}. This incremental scenario is reported separately from the fixed historical cohort dataset. ${S.checkpoints.aditi[24]&&add?'One 24-month scenario outcome is available for sustainability reporting.':''}</div>`}
function explorer(){const rows=filteredCohorts(),m=metricRows(rows),districtRows=DISTRICTS.map(d=>{const x=metricRows(rows.filter(r=>r.district===d[0]));return {name:d[0],...x}}).filter(d=>d.n);return `${aggregateFilters()}<div class="two">${card('Maharashtra district tiles',`<p>Clearly labeled map alternative: equal-size tiles, not geographic shapes. Coverage: 12 sample districts.</p><div class="tiles">${districtRows.map(d=>`<button class="tile ${d.r6/d.placed<.65?'low':''}" data-action="district" data-id="${esc(d.name)}"><span>${esc(d.name)}</span><strong>${pct(d.r6,d.placed)}</strong><small>6-month retention</small></button>`).join('')}</div>`)}${card('District comparison',districtRows.length?bars('6-month retained / placed',districtRows.map(d=>d.name),districtRows.map(d=>+(d.r6/d.placed*100).toFixed(1))):'<div class="empty">No matching data.</div>')}</div>${card('Cohort evidence table',`<div class="flex between"><p>${rows.length} cells · ${m.n.toLocaleString('en-IN')} sample registrations. Cells below 10 registrations are suppressed.</p>${button('Export filtered CSV','export-cohorts')}</div>${table(['District / sector','Cohort','Registered','Placed','Retained 6 mo','Salary proxy'],rows.filter(r=>r.n>=10).map(r=>[esc(r.district)+'<br><small>'+esc(r.sector)+'</small>',esc(r.gender+' · '+r.area+' · '+r.period),r.n,r.placed,r.r6,money(r.salary)]),'Synthetic aggregate cells; salary is a cell mean, not an individual salary.')}`)}`}
function analyst(){return card('Ask KRITI AI',`<div class="flex">${badge('Analytical simulation','amber')}${badge('Aggregate-only answers','blue')}</div><p style="margin-top:14px">Three evidence-based queries calculate from the synthetic cohort dataset. Other questions return an explicit coverage limitation.</p><div class="chips">${[['retention','Which districts have the lowest 6-month retention?'],['courses','Which courses have high enrolment but poor placement?'],['gender','Where is the gender employment gap highest?']].map(([id,q])=>button(q,'analyse',id)).join('')}</div><form data-form="analyst" class="chat-form" style="margin-top:16px"><input name="question" aria-label="Government analytical question" required maxlength="300" placeholder="Ask about retention, course placement or gender gap"><button class="btn primary">Analyse</button></form><div id="analysis-result" style="margin-top:22px">${analysisResult?analysisHTML(analysisResult):'<div class="empty">Choose a query to generate an answer, comparison chart and downloadable policy brief.</div>'}</div>`)}
function computeAnalysis(kind){const base=COHORTS.filter(r=>r.period==='2026-27'),all=metricRows(base);let labels,values,answer,method,action,average;if(kind==='retention'){const list=DISTRICTS.map(d=>{const m=metricRows(base.filter(r=>r.district===d[0]));return {name:d[0],value:+(m.r6/m.placed*100).toFixed(1)}}).sort((a,b)=>a.value-b.value).slice(0,5);labels=list.map(x=>x.name);values=list.map(x=>x.value);average=+(all.r6/all.placed*100).toFixed(1);answer=`${labels[0]} has the lowest six-month retention (${values[0]}%) among the 12 sample districts, versus ${average}% for the sample state cohort.`;method='Retained at month 6 / placed in the same cohort. Period 2026-27 is a synthetic scenario. No causal attribution.';action='Pilot employer mentoring, transport support and 60-day follow-ups in the two lowest-retention districts; compare equivalent cohorts.'}else if(kind==='courses'){labels=distinct('course');values=labels.map(c=>{const m=metricRows(base.filter(r=>r.course===c));return +(m.placed/m.completion*100).toFixed(1)});average=+(all.placed/all.completion*100).toFixed(1);const i=values.indexOf(Math.min(...values));answer=`${labels[i]} has the lowest certification-to-placement conversion (${values[i]}%) across the three course groups. The sample overall conversion is ${average}%.`;method='Placed / certified for each synthetic course group. Enrolment counts are in the explorer. Low conversion alone does not establish curriculum failure.';action='Validate job-role relevance with employers, add assessed internships and review interview preparation before increasing enrolment.'}else{labels=DISTRICTS.map(d=>d[0]);values=labels.map(d=>{const men=metricRows(base.filter(r=>r.district===d&&r.gender==='Men')),women=metricRows(base.filter(r=>r.district===d&&r.gender==='Women'));return +(100*(men.placed/men.n-women.placed/women.n)).toFixed(1)});const men=metricRows(base.filter(r=>r.gender==='Men')),women=metricRows(base.filter(r=>r.gender==='Women'));average=+(100*(men.placed/men.n-women.placed/women.n)).toFixed(1);const i=values.indexOf(Math.max(...values));answer=`${labels[i]} has the largest sample male–female placement-rate gap (${values[i]} percentage points), compared with ${average} points overall.`;method='Male placement/registration rate minus female rate. Synthetic data includes two gender categories only; broader representation is a production data requirement.';action='Audit access to transport, safe workplaces and scheduling; consult affected learners. Do not infer individual ability from group disparities.'}return {kind,labels,values,answer,method,action,average,confidence:'High arithmetic reproducibility; no real-world predictive confidence',source:'288 deterministic synthetic cells; analysis uses 2026-27 scenario, 12 districts. Explorer filters do not apply to these fixed demonstration queries.'}}
function analysisHTML(a){return `<div class="notice info"><b>${esc(a.answer)}</b></div><div class="grid" style="margin:18px 0">${kpi('Comparison average',a.average+(a.kind==='gender'?' pp':'%'),'Sample state cohort')}${kpi('Compared groups',a.labels.length,'Displayed in chart')}</div>${bars(a.kind==='gender'?'Gender placement gap':'Outcome comparison',a.labels,a.values,a.kind==='gender'?'percentage points':'%')}<h3>Possible causes to investigate</h3><p>Job-course mismatch, employer mix, mobility constraints and follow-up non-response are hypotheses, not findings from these generated values.</p><h3>Recommended intervention</h3><p>${esc(a.action)}</p><p><b>Confidence:</b> ${esc(a.confidence)}<br><b>Method:</b> ${esc(a.method)}<br><b>Source:</b> ${esc(a.source)}</p>${button('Download analytical brief','download-analysis','','btn primary')}`}

pdate outcome','intervention-update',String(i))]),'No intervention is sent to a department. Before/after values are local scenarios.'))}${card('Decision audit trail',auditTable(true))}`}

function indicatorLedger(rows){const m=metricRows(rows),women=metricRows(rows.filter(r=>r.gender==='Women')),men=metricRows(rows.filter(r=>r.gender==='Men')),rural=metricRows(rows.filter(r=>r.area==='Rural')),urban=metricRows(rows.filter(r=>r.area==='Urban'));const gap=(a,b)=>a.n&&b.n?(100*(a.placed/a.n-b.placed/b.n)).toFixed(1)+' pp':'Not comparable';const salaryValues=rows.flatMap(r=>Array(r.n).fill(r.salary)).sort((a,b)=>a-b);const mid=Math.floor(salaryValues.length/2),median=salaryValues.length?(salaryValues.length%2?salaryValues[mid]:(salaryValues[mid-1]+salaryValues[mid])/2):0;return card('Indicator definitions & transparency',`<details><summary>Explore the full KPI register and denominators</summary>${table(['Indicator','Selected sample value','Definition / limitation'],[['Students and job seekers',m.n-m.placed,'Registered minus placed; does not represent the whole labour force'],['Active employed at 6 months',m.r6,'Retained count for the same synthetic cohort'],['Not in a placed job',m.n-m.placed,'Includes incomplete training; not an official unemployment estimate'],['Re-employed',m.reemployed,'Synthetic transition count; not deduplicated longitudinal evidence'],['2-month retention',pct(m.r2,m.placed),'2-month retained / originally placed'],['12-month retention',pct(m.r12,m.placed),'12-month retained / originally placed'],['24-month retention',pct(m.r24,m.placed),'24-month retained / originally placed'],['Salary median proxy',median?money(median):'—','Weighted median of aggregate cell salary proxies; not a worker-level median'],['Salary-growth scenario','8%','Assumed annual growth; not an estimate from individual salary histories'],['Internship conversion',pct(m.internJobs,m.intern),'Interns entering jobs / internship participants'],['Skill gap index',m.gap+'/100','Registration-weighted synthetic cell gap'],['Employer-demand index','84/100','Independent illustration; does not respond to cohort filters'],['Gender placement gap',gap(men,women),'Male rate minus female rate, percentage points'],['Urban–rural placement gap',gap(urban,rural),'Urban rate minus rural rate, percentage points'],['Training-to-job relevance','78% sample benchmark','Separate sample benchmark, not derived from these cells'],['Cost per placement',m.placed?money(m.cost/m.placed):'—','Synthetic programme cost / placement count'],['Return on skilling investment','Not estimable here','Requires counterfactual earnings, attribution, time horizon and discount rate'],['Institutions / employers in sample',new Set(rows.map(r=>r.institution)).size+' / '+new Set(rows.map(r=>r.employer)).size,'Fictional entities, not officially verified']])}</details>`)}
const baseGovernment=views.government;

function insights(){const rows=filteredCohorts(),sectors=distinct('sector'),m=metricRows(rows);return `${aggregateFilters()}<div class="two">${card('Sector supply–demand heatmap',table(['Sector','Demand index','Available skill index','Gap'],sectors.map((s,i)=>[s,badge([91,84,80][i]+'/100','blue'),[64,55,43][i]+'/100',badge([27,29,37][i]+' points','amber')]),'Independent synthetic skill indices. These are not worker or vacancy counts.'))}${card('Early-warning watchlist',`<div class="alert-row"><b>Dropout hotspot</b><p>All seed cells assume 14% incomplete training. No differential dropout hotspot can be inferred; collect attendance and exit evidence.</p></div><div class="alert-row"><b>Salary stagnation</b><p>Flag rule: growth below 3% across two consecutive periods. Longitudinal wage evidence is insufficient for a district warning in this dataset.</p></div><div class="alert-row"><b>Low retention</b><p>Review districts below 65% six-month retention. Follow-up non-response may bias operational data.</p></div>`)}</div>${card('Two-year workforce planning scenario',`<div class="form-grid"><label class="field">Annual assumed skill-demand growth (%)<input data-input="forecast" id="forecast-demand" type="range" min="0" max="20" value="8"></label><label class="field">Annual assumed employment improvement (percentage points)<input data-input="forecast" id="forecast-employment" type="range" min="0" max="8" value="2"></label></div><div id="forecast-output">${forecastHTML(8,2)}</div><div class="notice">Scenario arithmetic, not model inference: demand index compounds annually; employment percentage adds a bounded annual improvement. No forecast confidence interval is supported by these invented assumptions.</div>`)}<div class="two">${card('Gender and inclusion comparison',bars('Placement rate',['Women','Men','Rural','Urban'],[['gender','Women'],['gender','Men'],['area','Rural'],['area','Urban']].map(([k,v])=>{const a=metricRows(rows.filter(r=>r[k]===v));return a.n?+(a.placed/a.n*100).toFixed(1):0})),'A zero may indicate no selected observations; consult explorer denominators.')}${card('Learning-to-employment transitions',bars('Cohort transitions',['Registered','Certified','Placed','6-mo sustained','24-mo sustained'],[m.n,m.completion,m.placed,m.r6,m.r24],'people'),'Counts share a defined entry cohort. Transitions do not establish causal programme impact.')}</div>${card('Scheme and institution benchmarking',table(['Scheme','Registered','Placed','Retained 6 mo','Cost / retained'],distinct('scheme').map(s=>{const a=metricRows(rows.filter(r=>r.scheme===s));return [s,a.n,a.placed,a.r6,a.r6?money(a.cost/a.r6):'—']}),'Compare equivalent intake populations before ranking providers.'))}${card('Migration and industry clusters',table(['Scenario movement','Learners','Industry cluster','Interpretation'],[['Nanded → Pune',42,'Analytics and services','Illustrative mobility corridor'],['Jalgaon → Nashik',28,'Manufacturing','Illustrative apprenticeship transition'],['Amravati → Nagpur',35,'Green energy and services','Illustrative employer access']],'Independent scenario counts; not measured migration. Districts and clusters are illustrative planning labels.'))}`}
function forecastHTML(growth,improvement){return `<div class="two" style="margin-top:16px">${lineChart('Assumed demand index',['2026','2027','2028'],[80,+(80*(1+growth/100)).toFixed(1),+(80*(1+growth/100)**2).toFixed(1)],'index')}${lineChart('Assumed employment rate',['2026','2027','2028'],[70,Math.min(100,70+improvement),Math.min(100,70+2*improvement)])}</div><p>Demand assumption: ${growth}% annual growth. Employment assumption: +${improvement} percentage points per year.</p>`}
views.insights=insights;

function mutate(action,detail,fn){fn();audit(action,detail);render();toast(detail);}
function courseDetail(id){const c=COURSES.find(c=>c.id===id);if(!c)return;openDialog(c.title+' · course pathway',`<dl class="keyvalue"><dt>Provider</dt><dd>${c.provider}</dd><dt>Platform integration</dt><dd>${c.platform}</dd><dt>Duration / level</dt><dd>${c.duration} weeks / ${c.level}</dd><dt>Language / mode</dt><dd>${c.language} / ${c.mode}</dd><dt>Fee</dt><dd>${money(c.fee)} · sample only</dd><dt>Eligibility</dt><dd>${c.eligibility}</dd><dt>Certification</dt><dd>Fictional provider-issued assessment credential</dd><dt>Skills gained</dt><dd>${c.skills.join(', ')}</dd><dt>Occupation</dt><dd>${c.occupation}</dd><dt>Employer demand</dt><dd>${c.demand}/100 · synthetic index</dd><dt>Salary potential</dt><dd>${money(c.salary[0])}–${money(c.salary[1])}/month · not a forecast</dd><dt>Completion</dt><dd>${c.completion}% · synthetic cohort</dd><dt>Placement relevance</dt><dd>Skill-based linkage; no placement guarantee</dd><dt>Why recommended</dt><dd>${c.reason}</dd></dl><div class="notice">Completing this demo simulates course completion and assessment evidence. No real enrolment, payment or certificate is created.</div><div class="modal-actions">${button(learning().enrolled.includes(id)?'Record demo completion':'Enrol locally',learning().enrolled.includes(id)?'complete-course':'enrol',id,'btn primary',learning().completed.includes(id)?'disabled':'')}</div>`)}
function surveyDialog(month){if(!guard(['employee']))return;const p=person(),old=p.history[month];const prev={6:2,12:6,24:12}[month];if(prev&&!p.history[prev])return toast('Record the '+prev+'-month checkpoint first.');const due=new Date(p.join+'T12:00:00Z');due.setUTCMonth(due.getUTCMonth()+month);const scenario=due.toISOString().slice(0,10)>AS_OF;const val=(k,v)=>old?.[k]??v;openDialog(month+'-month employment outcome',`<div class="notice ${scenario?'':'info'}">Due ${due.toISOString().slice(0,10)}. ${scenario?'Future milestone: saved as scenario data, not an observed outcome.':'Historical synthetic record; no real employment verification.'}</div><form data-form="survey" data-month="${month}" class="form-grid" style="margin-top:18px">${selectField('Employment sustained?','sustained',['Yes','No'],val('sustained','Yes'))}${selectField('Same employer?','same',['Yes','No'],val('same','Yes'))}${fieldspec('Present job role / last role','job','text',val('job',month>=12?'Data Analyst':p.job),'required maxlength="100"')}${fieldspec('Monthly salary (INR; 0 if unemployed)','salary','number',val('salary',p.base+[0,1000,4000,9000][[2,6,12,24].indexOf(month)]),'required min="0" max="1000000"')}${fieldspec('Working hours / week','hours','number',val('hours',40),'required min="0" max="80"')}${selectField('Contract status','contract',['Permanent','Contract','Apprenticeship','Not employed'],val('contract','Permanent'))}${selectField('Social security coverage (sample)','social',['EPFO + ESIC (sample)','EPFO (sample)','Other','None','Not employed'],val('social','EPFO + ESIC (sample)'))}${fieldspec('Skill utilisation (%)','utilisation','number',val('utilisation',84),'required min="0" max="100"')}${fieldspec('Job satisfaction (1–5)','satisfaction','number',val('satisfaction',4),'required min="1" max="5"')}${fieldspec('Promotion or role change','promotion','text',val('promotion',month>=12?'Expanded analyst responsibilities':'None'),'required maxlength="150"')}${fieldspec('Reason for leaving, if applicable','leaving','text',val('leaving','Not applicable'),'required maxlength="200"')}${fieldspec('Unemployment spell (days)','unemployment','number',val('unemployment',0),'required min="0" max="730"')}${fieldspec('Further training / education','training','text',val('training','Python and cloud micro-credentials'),'required maxlength="150"')}${fieldspec('District / state migration','migration','text',val('migration','None'),'required maxlength="150"')}${selectField('Job related to completed course?','related',['Yes','Partly','No'],val('related','Yes'))}${selectField('Career mobility','mobility',['Upward','Horizontal','Downward'],val('mobility',month>=12?'Upward':'Horizontal'))}<label class="check-label full"><input type="checkbox" name="ack" required>I understand this is a ${scenario?'future scenario':'synthetic'} survey, not a verified real-world outcome.</label><div id="survey-error" class="error-text full" role="alert"></div><button class="btn primary full">Save checkpoint</button></form>`)}
function chatAnswer(q){const low=q.toLowerCase(),j=S.jobs[0],m=match(j);if(/salary|pay|वेतन/.test(low))return `The fictional ${j.title} opening in ${j.location} offers ${money(j.salaryMin)}–${money(j.salaryMax)} monthly gross. This is a posted sample band, not a live salary estimate. Compare role scope, benefits and assessed skills before deciding.`;if(/plan|month|move|better/.test(low))return '3 months: complete assessed Python and visualization, build a portfolio and finish an internship. 6 months: secure a suitable role, record job quality and review course relevance. 12 months: strengthen cloud skills, evidence salary progression and discuss advancement. These are suggested actions, not guaranteed outcomes.';if(/course|learn/.test(low))return `Start with ${COURSES[0].title}: ${COURSES[0].duration} weeks, English/Marathi, SQL + Python + visualization. Your missing analyst evidence is ${m.missing.join(', ')||'none'}. Consider cloud only after foundation proficiency. Course fees and outcomes are synthetic.`;if(/missing|gap/.test(low))return `For ${j.title}, the required skills are ${j.skills.join(', ')}. Missing verified evidence: ${m.missing.join(', ')||'none'}. Your ${m.score}% score is evidenced required skills divided by all required skills; self-declared skills do not count.`;if(/why|reason/.test(low))return `This role is recommended because it links to your data/analytics interest and preferred Pune location. Skill evidence covers ${m.score}% of its ${j.skills.length} requirements. The demonstration does not score gender, social category or disability.`;if(/hiring|district|industr/.test(low))return 'The sample Pune catalogue includes analytics employment and internships. Nashik includes a manufacturing apprenticeship. These are fictional vacancies; no live district hiring feed is connected.';if(/role|job|match|skill/.test(low))return `${j.title} currently matches ${m.score}% of evidenced required skills. Analytics internships offer a lower-risk transition to practical work. Review missing skills, employment type and eligibility in Opportunities before applying.`;return 'I can explain this demo’s roles, missing skills, course links, salary bands, district vacancies and 3/6/12-month plans. I cannot answer live market or unrelated questions. Try one of the suggested prompts.'}
function runChat(q){chatHistory.push({user:true,text:q},{user:false,text:chatAnswer(q)});if(chatHistory.length>20)chatHistory=chatHistory.slice(-20);render();const log=$('chat-log');if(log)log.scrollTop=log.scrollHeight;}
function runAnalysis(id){if(!guard(['government']))return;analysisResult=null;const dest=$('analysis-result');if(dest)dest.innerHTML='<div class="skeleton" role="status" aria-label="Calculating synthetic cohort comparisons"></div>';setTimeout(()=>{if(role!=='government'||route!=='analyst')return;analysisResult=computeAnalysis(id);$('analysis-result').innerHTML=analysisHTML(analysisResult)},180);}
function help(kind){openDialog(kind==='privacy'?'Privacy, consent and data use':'Help & demonstration guide',`<p><b>Independent prototype. No government affiliation or live integrations.</b></p><p>Choose View Demo As to enter any of the five distinct workspaces. Use Impact Story for a guided six-minute presentation. All changes are synthetic and stay on this browser.</p><p>localStorage persists enrolments, applications, surveys, consent and policy actions. Reset demo data removes this application’s stored state and restores the seed; other browser data is untouched. If browser storage is blocked, the app runs in memory.</p><p>No network calls, telemetry, sensitive identifiers, passwords or uploads are needed. Storage is not encrypted; do not enter real personal information.</p><p>Hindi and Marathi cover navigation and landing messaging; detailed forms and analytics remain English. Use A± for larger text and stronger contrast.</p><p>For a connected demonstration: institution verifies → student completes course → institution assigns internship → student applies → employer offers → student accepts → employer verifies → employee tracks outcomes.</p>${button('Close','close','','btn primary')}`)}

 milestone:id=>{const i=Number(id),dest=i<1?['student','profile']:i===1?['institution','cohorts']:i<4?['student','profile']:i<6?['student','courses']:i<8?['institution','cohorts']:i===8?['student','opportunities']:i===9?['student','applications']:i===10?['employer','verification']:i<15?['employee','checkpoints']:['government','government'];openDialog(STEPS[i],`<p>Status: <b>${getStage(i)?'Completed in local state':'Not yet completed'}</b>.</p><p>${i>=11?'This milestone uses a future scenario checkpoint. It is not an observed employment outcome.':'Complete the responsible workspace action; prerequisite and consent checks apply.'}</p><p>Responsible role: ${ROLES[dest[0]].title}</p>${button('Open responsible workspace','milestone-open',dest.join('|'),'btn primary')}`)},
 'milestone-open':id=>{closeDialog();const [r,p]=id.split('|');role=r;route=p;if(r==='employee'&&S.employment)employeeId='aditi';render()},
 'job-assist':()=>{const f=$('vacancy-form'),d=Object.fromEntries(new FormData(f));const list=d.skills.split(',').map(s=>s.trim()).filter(Boolean);const warnings=[];if(+d.experience>3&&/junior|intern|entry/i.test(d.title))warnings.push('Experience requirement is high for an entry-level title.');if(+d.salaryMin<18000&&d.type==='Permanent')warnings.push('Pay is below the sample entry-analyst comparison band of ₹24,000–32,000.');if(list.length>8)warnings.push('Consider reducing the required skill list to core competencies.');$('job-assistance').innerHTML=`<div class="notice info"><b>Local job-description assistant</b><p>Proposed description: ${esc(d.title||'Analyst')} in ${esc(d.location)}. Use ${esc(list.join(', '))} to deliver documented, quality-checked work. Collaborate with stakeholders and build toward ${esc(d.pathway)}. Provide equivalent evidence pathways and reasonable accommodation.</p><p>Recommended skills: SQL, Python, visualization and communication for an analyst role. Candidate availability: ${Object.keys(S.applications).length} current local applicant(s); no live market pool. Illustrative time-to-hire assumption: 21–35 days, not a prediction.</p><p>${warnings.length?esc(warnings.join(' ')):'No rule-based requirement warnings. Human review is still required.'}</p><p>Rejected candidates: recommend assessed Python and portfolio work.</p></div>`}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const fn=actions[b.dataset.action];if(fn)fn(b.dataset.id);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){filters[el.dataset.filter]=el.value;render();return}switch(el.dataset.change){case'role':switchRole(el.value);break;case'language':language=el.value;render();break;case'employee':employeeId=el.value;S.activeEmployee=employeeId;persist();render();break;case'jobtype':jobType=el.value;render();break;case'national-region':nationalRegion=el.value;render();break;case'national-metric':nationalMetric=Number(el.value);render();break}});
document.addEventListener('input',e=>{const el=e.target,key=el.dataset.input;if(key==='forecast'){$('forecast-output').innerHTML=forecastHTML(Number($('forecast-demand').value),Number($('forecast-employment').value));return}if(key==='scenario'){$('scenario-result').innerHTML=scenarioHTML(Number(el.value));return}const id=el.id,pos=el.selectionStart;if(key==='courses'){courseQuery=el.value;$('course-results').innerHTML=courseCards(COURSES.filter(c=>(c.title+' '+c.skills.join(' ')+' '+c.occupation).toLowerCase().includes(courseQuery.toLowerCase())))}if(key==='jobs'){jobQuery=el.value;$('job-results').innerHTML=jobCards(S.jobs.filter(j=>(j.title+' '+j.location+' '+j.skills.join(' ')).toLowerCase().includes(jobQuery.toLowerCase())&&(jobType==='All'||j.type===jobType)))}if(key==='cohorts'){cohortQuery=el.value;$('cohort-results').innerHTML=cohortTable()}if(key==='national'){nationalQuery=el.value;const list=NATIONAL_STATES.filter(s=>s[0].toLowerCase().includes(nationalQuery.toLowerCase())&&(nationalRegion==='All'||regionFor(s[0])===nationalRegion)).sort((a,b)=>(a[nationalMetric]-b[nationalMetric])*(nationalAsc?1:-1));$('national-results').innerHTML=nationalTable(list)}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f)),type=f.dataset.form;
if(type==='profile'){if(!guard(['student']))return;mutate('Preferences updated','Career profile preferences saved.',()=>Object.assign(S.profile,d));}
if(type==='chat'){if(guard(['student']))runChat(d.question.trim());}
if(type==='analyst'){if(!guard(['government']))return;const q=d.question.toLowerCase();if(/retention|retain/.test(q))runAnalysis('retention');else if(/course|placement/.test(q))runAnalysis('courses');else if(/gender|women/.test(q))runAnalysis('gender');else $('analysis-result').innerHTML='<div class="notice">This local analyst supports retention, course placement and gender-gap queries. It cannot explain causal unemployment changes or predict real future demand. Use a suggested query.</div>';}
if(type==='vacancy'){if(!guard(['employer']))return;if(+d.salaryMax<+d.salaryMin){$('vacancy-error').textContent='Maximum salary must be at least the minimum salary.';return}const parsedSkills=d.skills.split(',').map(s=>s.trim()).filter(Boolean);if(!d.title.trim()||!parsedSkills.length){$('vacancy-error').textContent='Provide a title and at least one technical skill.';return}mutate('Vacancy published','Specialised vacancy published to the local student catalogue.',()=>S.jobs.push({...d,id:'J'+Date.now(),skills:parsedSkills,openings:+d.openings,salaryMin:+d.salaryMin,salaryMax:+d.salaryMax,experience:+d.experience,company:'Sahyadri Analytics Pvt Ltd (fictional)'}));}
if(type==='interview'){if(!guard(['employer'])||!S.consent.employer)return toast('Active consent is required.');const a=S.applications[f.dataset.job];if(a?.status!=='Shortlisted')return toast('Shortlisting is required.');closeDialog();mutate('Interview scheduled','Interview saved locally; no invite sent.',()=>{a.status='Interview';a.interview=d.when.replace('T',' ')+' · '+d.format});}
if(type==='employment'){if(!guard(['employer']))return;if(!S.consent.employer){$('employment-error').textContent='Active employment-purpose consent is required.';return}if(S.employment)return toast('Employment already confirmed.');const entry=Object.entries(S.applications).find(([,a])=>a.status==='Accepted');if(!entry)return toast('An accepted offer is required.');const job=S.jobs.find(j=>j.id===entry[0]);if(+d.salary<job.salaryMin||+d.salary>job.salaryMax){$('employment-error').textContent='Agreed salary must be within the posted salary range.';return}mutate('Employment confirmed','Employment event propagated to individual, institution and aggregate scenario views.',()=>{S.employment={job:job.title,jobId:job.id,salary:+d.salary,join:d.join,scenario:d.join>AS_OF};entry[1].status='Onboarded';S.activeEmployee='aditi';access('Sahyadri Analytics','Employment verification','Accepted offer, joining date, salary band','Confirmed locally')});}
if(type==='survey'){if(!guard(['employee']))return;const m=+f.dataset.month,p=person();if(d.sustained==='No'&&(+d.salary!==0||d.leaving==='Not applicable')){$('survey-error').textContent='For unemployment, enter salary 0 and an applicable reason for leaving.';return}const due=new Date(p.join+'T12:00:00Z');due.setUTCMonth(due.getUTCMonth()+m);closeDialog();mutate('Outcome checkpoint recorded',m+'-month '+(due.toISOString().slice(0,10)>AS_OF?'scenario':'sample')+' saved.',()=>{S.checkpoints[employeeId][m]={...d,salary:+d.salary,hours:+d.hours,utilisation:+d.utilisation,satisfaction:+d.satisfaction,unemployment:+d.unemployment,scenario:due.toISOString().slice(0,10)>AS_OF,employerConfirmed:false}});}
if(type==='consent'){if(!guard(['student','employee']))return;const values={education:!!d.education,employer:!!d.employer,analytics:!!d.analytics};mutate('Consent preferences changed','Purpose-based access choices updated.',()=>{if(role==='employee'&&employeeId==='arjun')S.arjunConsent=values;else S.consent=values});}
if(type==='curriculum'){if(!guard(['institution']))return;mutate('Curriculum remapped','Alignment recalculated against four industry skills.',()=>S.curriculum=new FormData(f).getAll('skills'));}
if(type==='improvement'){if(!guard(['institution']))return;mutate('Improvement action created','Curriculum action assigned locally.',()=>S.improvements.push({...d,done:false}));}
if(type==='feedback'){if(!guard(['employer']))return;mutate('Employer skill feedback','Skill signal recorded for institutional curriculum review.',()=>S.feedback.push({skill:d.skill,rating:+d.rating}));}
if(type==='intervention'){if(!guard(['government']))return;mutate('Policy intervention created','Intervention saved with an owner, baseline and target.',()=>S.interventions.push({...d,baseline:+d.baseline,target:+d.target,budget:+d.budget,status:'Planned'}));}
if(type==='intervention-update'){if(!guard(['government']))return;const x=S.interventions[f.dataset.index];if(!x)return;closeDialog();mutate('Policy outcome updated','Before / after scenario recorded in the intervention register.',()=>Object.assign(x,{status:d.status,actual:+d.actual}));}
if(type==='request'){const requestType=f.dataset.type;closeDialog();mutate('Support request recorded','Local request received; no external complaint sent.',()=>S.grievances.push({id:'REQ-'+String(S.grievances.length+1).padStart(4,'0'),type:requestType,role:role||'visitor',summary:d.summary,category:d.category}));}
});
$('dialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
render();


</script></body></html>
